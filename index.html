async function caricaTitoli(){
  const coda=DATI.filter(d=>d.rss&&!(T[d.id]&&'img' in T[d.id]&&Date.now()-T[d.id].ts<18e5));
  const lavora=async()=>{while(coda.length){const d=coda.shift();
    try{
      const r=await fetch('https://api.rss2json.com/v1/api.json?rss_url='+encodeURIComponent(d.rss));
      const j=await r.json();
      if(j.items&&j.items.length){
        const nuovi=j.items.slice(0,3).map(i=>i.title.trim());
        const vecchio=T[d.id]&&T[d.id].t&&T[d.id].t[0];
        const it=j.items[0];let im=it.thumbnail||'';
        if(!im&&it.enclosure&&it.enclosure.link&&/image|\.(jpe?g|png|webp)/i.test((it.enclosure.type||'')+it.enclosure.link))im=it.enclosure.link;
        if(!im){const m=(it.content||it.description||'').match(/<img[^>]+src=["']([^"']+)/i);if(m)im=m[1]}
        if(im)im=im.replace(/^http:/i,'https:');
        T[d.id]={t:nuovi,ts:Date.now(),img:im};sv('tm_t',T);if(im)setImg(d.id,im);
        document.querySelectorAll(`[data-tt="${d.id}"]`).forEach(e=>e.innerHTML=nuovi.slice(0,S.vista==='titoli'?3:S.vista==='griglia'?1:2).map(x=>`<p class="ti">${esc(x)}</p>`).join(''));
        if(S.notif&&F.fav[d.id]!==undefined&&vecchio&&vecchio!==nuovi[0])notifica(d,nuovi[0]);
      }
    }catch(e){document.querySelectorAll(`[data-ti="${d.id}"]`).forEach(x=>x.textContent=navigator.onLine?'Titoli non disponibili ora':'Offline: titoli non aggiornati')}
  }};
  await Promise.all([lavora(),lavora(),lavora()]);
  try{localStorage.setItem('tm_u',Date.now())}catch(e){}const u=$('#up');if(u)u.textContent=updTxt();
}
async function notifica(d,t){
  try{const reg=await navigator.serviceWorker.ready;reg.showNotification(d.nome,{body:t,icon:'./icons/icon-192.png',tag:d.id})}catch(e){}
}

function muovi(id,m){
  const ids=ordinati().map(d=>d.id);
  if(m==='top'){ids.splice(ids.indexOf(id),1);ids.unshift(id)}
  else{
    const pool=ids.filter(i=>{const d=DATI.find(x=>x.id===i);return visibile(d)&&(!Q.trim()||norm(d.nome+' '+d.nazione+' '+d.continente+' '+d.tipo).includes(norm(Q.trim())))});
    const n=pool[pool.indexOf(id)+m];if(!n)return toast(m<0?'È già in cima':'È già in fondo');
    const a=ids.indexOf(id),b=ids.indexOf(n);[ids[a],ids[b]]=[ids[b],ids[a]];
  }
  S.ordine=ids;sv('tm_s',S);view==='home'?renderHome():renderOrg();
  const el=document.querySelector('[data-id="'+id+'"]');if(el)el.scrollIntoView({block:'center'});
}

function scegliCartella(id){

  const nomi=[...new Set([...F.cartelle,d.nazione])];
  let sel=att!==undefined?att:d.nazione;
  const draw=()=>{
    sheet(`<h3 class="serif">${att!==undefined?'Modifica':'Salva'} · ${esc(d.nome)}</h3><p class="ds">Scegli la cartella:</p><div class="chips" style="flex-wrap:wrap;overflow:visible">${nomi.map(n=>`<button class="chip ${sel===n?'on':''}" data-c="${esc(n)}">📁 ${esc(n)}</button>`).join('')}<button class="chip ${sel===''?'on':''}" data-c="">Senza cartella</button></div><p class="ds">Oppure crea una nuova cartella (nazione o altro):</p><div class="row"><input type="text" id="nc" placeholder="Nome cartella" maxlength="40"><button class="btn" id="ac" style="flex:none">Crea</button></div><div class="row" style="margin-top:1rem"><button class="btn" id="an">Annulla</button><button class="btn p" id="ok">Salva</button></div>`);

const host=l=>{try{return new URL(l).hostname.replace(/^www\./,'')}catch(e){return''}};
function salva(d,top){
  X.add.push(d);sv('tm_x',X);rebuild();
  if(top)S.ordine=[d.id,...ordinati().map(x=>x.id).filter(i=>i!==d.id)];
  S.filtro='Tutti';S.naz='Tutti';S.tipo='Tutti';sv('tm_s',S);Q='';show('home');toast('Giornale aggiunto');
}
function aggiungi(){
  const dl=(id,a)=>`<datalist id="${id}">${[...new Set(a)].map(x=>`<option value="${esc(x)}">`).join('')}</datalist>`;
  sheet(`<h3 class="serif">Aggiungi un giornale</h3>
  <button class="btn p" id="cat" style="width:100%;margin-bottom:.8rem">📚 Scegli dal catalogo</button>
  <p class="ds">Oppure inseriscilo a mano:</p>
  <input type="text" id="a1" class="in" placeholder="Nome del giornale" maxlength="60">
  <input type="text" id="a2" class="in" placeholder="Link (https://…)" inputmode="url" style="margin-top:.5rem">
  <input type="text" id="a3" class="in" list="d3" placeholder="Continente (scegli o scrivi)" style="margin-top:.5rem">
  <input type="text" id="a4" class="in" list="d4" placeholder="Nazione" style="margin-top:.5rem">
  <select id="a6" class="in" style="width:100%;margin-top:.5rem" aria-label="Tipo"><option>Quotidiano</option><option>Sport</option><option>Economia</option><option>Agenzia</option></select>
  <input type="text" id="a5" class="in" placeholder="Breve descrizione (facoltativa)" maxlength="160" style="margin-top:.5rem">
  ${dl('d3',DATI.map(d=>d.continente))}${dl('d4',DATI.map(d=>d.nazione))}
  <div class="row" style="margin-top:1rem"><button class="btn" id="an">Annulla</button><button class="btn p" id="ok">Aggiungi</button></div>`);
  $('#an').onclick=chiudi;$('#cat').onclick=catalogo;
  $('#ok').onclick=()=>{
    const n=$('#a1').value.trim();let l=$('#a2').value.trim();const c=$('#a3').value.trim(),z=$('#a4').value.trim(),ds=$('#a5').value.trim(),tp=$('#a6').value;
    if(!n||!l||!c||!z)return toast('Compila nome, link, continente e nazione');
    if(!/^https?:\/\//i.test(l))l='https://'+l;
    let u;try{u=new URL(l)}catch(e){return toast('Il link non è valido')}
    conferma('Aggiungere «'+esc(n)+'» alla home?',()=>salva({...N('c'+Date.now(),n,u.hostname,c,z,ds||'Testata aggiunta da te.','',l),tipo:tp},true));
  };
}
function catalogo(){
  const have=new Set(DATI.map(d=>host(d.link)));
  const l=CAT.map(r=>r.split('|')).filter(r=>!have.has(r[4])).sort((a,b)=>(a[0]+a[1]).localeCompare(b[0]+b[1]));
  let h='<div class="vh"><h3 class="serif" style="margin:0;flex:1">Catalogo testate</h3><button class="cl" id="cx">✕ Chiudi</button></div>';
  if(!l.length)h+='<p class="ds">Hai già aggiunto tutte le testate del catalogo.</p>';
  let last='';
  l.forEach((r,i)=>{if(r[1]!==last){last=r[1];h+=`<div class="fh"><h3 class="serif">${esc(r[1])}</h3></div>`}h+=`<div class="lt"><div class="x"><strong>${esc(r[3])}</strong><div class="sub">${esc(r[0])} · ${esc(r[2])}</div></div><button class="btn p" data-ct="${i}" style="flex:none" aria-label="Aggiungi">➕</button></div>`});
  sheet(h);
  $('#cx').onclick=chiudi;
  $$('#sh [data-ct]').forEach(b=>b.onclick=()=>{const r=l[+b.dataset.ct];conferma('Aggiungere «'+esc(r[3])+'» alla home?',()=>salva({...N('k_'+r[4],r[3],r[4],r[0],r[1],'Testata aggiunta dal catalogo.',''),tipo:r[2]}))});
}
function nuovaCartella(){
  sheet(`<h3 class="serif">Nuova cartella</h3><input type="text" id="nc" placeholder="Es. Italia" maxlength="40"><div class="row" style="margin-top:1rem"><button class="btn" id="an">Annulla</button><button class="btn p" id="ok">Crea</button></div>`);
  $('#an').onclick=chiudi;$('#ok').onclick=()=>{const v=$('#nc').value.trim();if(!v)return toast('Scrivi un nome');if(!F.cartelle.includes(v))F.cartelle.push(v);sv('tm_f',F);chiudi();renderPref()};
}
function rinomina(c){
  sheet(`<h3 class="serif">Rinomina cartella</h3><input type="text" id="nc" value="${esc(c)}" maxlength="40"><div class="row" style="margin-top:1rem"><button class="btn" id="an">Annulla</button><button class="btn p" id="ok">Salva</button></div>`);
  $('#an').onclick=chiudi;
  $('#ok').onclick=()=>{const v=$('#nc').value.trim();if(!v)return toast('Scrivi un nome');
    conferma('Rinominare la cartella?',()=>{F.cartelle=[...new Set(F.cartelle.map(x=>x===c?v:x))];if(!F.cartelle.includes(v))F.cartelle.push(v);Object.keys(F.fav).forEach(k=>{if(F.fav[k]===c)F.fav[k]=v});sv('tm_f',F);renderPref()})};
}

/* ---------- NAVIGAZIONE ---------- */
const TIT={home:'TestateMondiali',pref:'Preferiti',org:'Organizza',imp:'Impostazioni',guida:'Guida',info:'Info'};
function show(v){
  view=v;orgMode=false;chiudi();
  $$('.view').forEach(e=>e.classList.toggle('on',e.id==='v-'+v));
  $('#tt').textContent=TIT[v];
  ({home:renderHome,pref:renderPref,org:renderOrg,imp:renderImp,guida:renderGuida,info:renderInfo})[v]();
  scrollTo(0,0);
}
const refresh=()=>show(view);
history.replaceState({r:1},'');history.pushState({t:1},'');
addEventListener('popstate',()=>{show('home');history.pushState({t:1},'')});

/* ---------- EVENTI ---------- */
document.addEventListener('click',e=>{
  const t=e.target.closest('button,a,[data-o]');
  if(!t)return;
  const D=t.dataset;
  if(t.tagName==='A')e.preventDefault();
  if(t.id==='bm'){$('#dr').classList.add('on');$('#ov').classList.add('on');return}
  if(t.id==='b3'){const o=$('#m3').classList.toggle('on');$('#ov').classList.toggle('on',o);return}
  if(t.id==='ov')return;
  if(D.v==='org'){show('home');orgMode=true;return renderHome()}
  if(D.v)return show(D.v);
  if('om' in D){orgMode=!orgMode;return renderHome()}
  if(D.pin)return muovi(D.pin,-1);
  if('add' in D)return aggiungi();
  if(D.rm){const d=DATI.find(x=>x.id===D.rm);return conferma('Eliminare «'+esc(d.nome)+'» dall\'app?',()=>{
    if(X.add.some(a=>a.id===d.id))X.add=X.add.filter(a=>a.id!==d.id);else X.del.push(d.id);
    delete F.fav[d.id];S.ordine=S.ordine.filter(i=>i!==d.id);sv('tm_x',X);sv('tm_f',F);sv('tm_s',S);rebuild();renderHome();toast('Giornale eliminato')})}
  if('rs' in D)return conferma('Ripristinare le testate eliminate?',()=>{X.del=[];sv('tm_x',X);rebuild();toast('Testate ripristinate')});
  if(D.a){chiudi();
    if(D.a==='inst'){if(deferred){deferred.prompt();deferred=null}else toast('Dal menu del browser scegli “Aggiungi a schermata Home”')}
    else if(D.a==='tema'){S.tema=eff()==='chiaro'?'scuro':'chiaro';sv('tm_s',S);applica();if(view==='imp')renderImp()}
    else show(D.a);return}
  if(D.vi){S.vista=D.vi;sv('tm_s',S);return renderHome()}
  if(D.f){S.filtro=D.f;S.naz='Tutti';sv('tm_s',S);return rh()}
  if(D.z){S.naz=D.z;sv('tm_s',S);return rh()}
  if(D.ty){S.tipo=D.ty;sv('tm_s',S);return rh()}
  if('ad' in D){chiudi();return aggiungi()}
  if('cg' in D){chiudi();return catalogo()}
  if('ag' in D){toast('Aggiornamento in corso…');Object.values(T).forEach(x=>x.ts=0);return caricaTitoli().then(()=>toast('Titoli aggiornati'))}
  if(D.o)return apri(DATI.find(d=>d.id===D.o).link);
  if(D.s)return scegliCartella(D.s);
  if(D.ed)return scegliCartella(D.ed);
  if(D.del)return conferma('Eliminare questa testata dai preferiti?',()=>{delete F.fav[D.del];sv('tm_f',F);renderPref()});
  if('nc' in D)return nuovaCartella();
  if(D.rc)return rinomina(D.rc);
  if(D.dc)return conferma('Eliminare la cartella? Le testate resteranno nei preferiti, senza cartella.',()=>{F.cartelle=F.cartelle.filter(x=>x!==D.dc);Object.keys(F.fav).forEach(k=>{if(F.fav[k]===D.dc)F.fav[k]=''});sv('tm_f',F);renderPref()});
  if(D.up)return muovi(D.up,-1);
  if(D.dn)return muovi(D.dn,1);
  if(D.top)return muovi(D.top,'top');
  if('ro' in D)return conferma('Ripristinare l\'ordine originale?',()=>{S.ordine=[];sv('tm_s',S);renderOrg()});
  if(D.g){S.grad=D.g;sv('tm_s',S);applica();return renderImp()}
  if(D.t){S.tema=D.t;sv('tm_s',S);applica();return renderImp()}
  if(D.fs){S.font=+D.fs;sv('tm_s',S);applica();return renderImp()}
  if('an' in D){S.anim=!S.anim;sv('tm_s',S);applica();return renderImp()}
  if('x' in D)return show('home');
  if(D.b){S.browser=D.b;sv('tm_s',S);return renderImp()}
  if(D.n!==undefined){
    if(D.n==='1'){if(!('Notification' in window))return toast('Notifiche non supportate');
      Notification.requestPermission().then(p=>{S.notif=p==='granted';sv('tm_s',S);renderImp();if(!S.notif)toast('Permesso negato dal browser')})}
    else{S.notif=false;sv('tm_s',S);renderImp()}return}
  if('cc' in D)return conferma('Svuotare i titoli salvati?',()=>{T={};sv('tm_t',T);toast('Archivio svuotato')});
  if(t.id==='ex'){const b=new Blob([JSON.stringify({app:'TestateMondiali',v:VER,S,F,X},null,1)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='TestateMondiali-dati.json';a.click();return toast('Dati esportati')}
  if(t.id==='im')return $('#fi').click();
});
$('#ov').onclick=chiudi;
document.addEventListener('keydown',e=>{if((e.key==='Enter')&&e.target.dataset.o)apri(DATI.find(d=>d.id===e.target.dataset.o).link)});
document.addEventListener('change',e=>{if(e.target.id==='ty'){S.tipo=e.target.value;sv('tm_s',S);renderHome()}});
document.addEventListener('input',e=>{if(e.target.id==='q'){Q=e.target.value;applicaQ()}if(e.target.id==='fr'){S.font=+e.target.value;sv('tm_s',S);applica()}});
$('#fi').onchange=e=>{
  const f=e.target.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=()=>{try{const j=JSON.parse(r.result);if(j.app!=='TestateMondiali')throw 0;
    conferma('Importare i dati? Quelli attuali verranno sostituiti.',()=>{Object.assign(S,j.S||{});F=Object.assign({cartelle:[],fav:{}},j.F||{});X=Object.assign({add:[],del:[]},j.X||{});sv('tm_x',X);rebuild();sv('tm_s',S);sv('tm_f',F);applica();show('imp');toast('Dati importati')})}
    catch(x){toast('File non valido')}};
  r.readAsText(f);e.target.value='';
};
addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferred=e});
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
