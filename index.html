function estraiNazione(testo){
  const m=testo.match(/(?:quotidiano|giornale|newspaper|daily|testata|rivista)\s+(?:italiano|francese|tedesco|spagnolo|inglese|statunitense|americano|britannico|russo|giapponese|cinese|indiano|brasiliano|argentino|messicano|australiano|canadese|svizzero|austriaco|belga|olandese|portoghese|greco|polacco|ungherese|rumeno|svedese|norvegese|danese|finlandese|turco|ucraino|israeliano|egiziano|sudafricano|nigeriano|keniano|marocchino|tunisino|qatariota|emiratino|saudita|libanese|iraniano|pakistano|bangladese|coreano|thailandese|singaporiano|malese|indonesiano|filippino|vietnamita|neozelandese)/i);
  if(!m)return null;
  const naz=m[0].split(/\s+/).slice(1).join(' ').toLowerCase();
  const map={'italiano':'Italia','francese':'Francia','tedesco':'Germania','spagnolo':'Spagna','inglese':'Regno Unito','statunitense':'USA','americano':'USA','britannico':'Regno Unito','russo':'Russia','giapponese':'Giappone','cinese':'Cina','indiano':'India','brasiliano':'Brasile','argentino':'Argentina','messicano':'Messico','australiano':'Australia','canadese':'Canada','svizzero':'Svizzera','austriaco':'Austria','belga':'Belgio','olandese':'Olanda','portoghese':'Portogallo','greco':'Grecia','polacco':'Polonia','ungherese':'Ungheria','rumeno':'Romania','svedese':'Svezia','norvegese':'Norvegia','danese':'Danimarca','finlandese':'Finlandia','turco':'Turchia','ucraino':'Ucraina','israeliano':'Israele','egiziano':'Egitto','sudafricano':'Sudafrica','nigeriano':'Nigeria','keniano':'Kenya','marocchino':'Marocco','tunisino':'Tunisia','qatariota':'Qatar','emiratino':'Emirati Arabi','saudita':'Arabia Saudita','libanese':'Libano','iraniano':'Iran','pakistano':'Pakistan','bangladese':'Bangladesh','coreano':'Corea del Sud','thailandese':'Thailandia','singaporiano':'Singapore','malese':'Malesia','indonesiano':'Indonesia','filippino':'Filippine','vietnamita':'Vietnam','neozelandese':'Nuova Zelanda'};
  return map[naz]||null;
}
function estraiDominio(extract,title){
  const urls=extract.match(/https?:\/\/[^\s\)\]"']+/g)||[];
  for(const u of urls){
    try{
      const h=new URL(u).hostname.replace(/^www\./,'');
      if(/wikipedia|wikimedia|wikidata|archive\.org|google|facebook|twitter|youtube|instagram/.test(h))continue;
      if(/\.(com|org|net|it|fr|de|es|uk|co\.uk|ru|jp|cn|in|br|ar|mx|au|ca|ch|at|be|nl|pt|gr|pl|hu|ro|se|no|dk|fi|tr|ua|il|eg|za|ng|ke|ma|tn|qa|ae|sa|lb|ir|pk|bd|kr|th|sg|my|id|ph|vn|nz|fj|eu)$/i.test(h))return h;
    }catch(e){}
  }
  const slug=title.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]/g,'');
  if(slug.length>=3&&slug.length<=25)return slug+'.com';
  return '';
}
async function cercaWikipedia(q){
  const nq=norm(q.trim());
  if(nq.length<3)return [];
  const now=Date.now();
  if(wikiCache[nq]&&now-wikiCache[nq].ts<WIKI_TTL)return wikiCache[nq].data;
  if(wikiAbort)wikiAbort.abort();
  wikiAbort=new AbortController();
  try{
    const url1=`https://it.wikipedia.org/w/api.php?action=query&list=search&srsearch=${encodeURIComponent(q+' giornale OR quotidiano OR newspaper')}&srlimit=8&format=json&origin=*`;
    const r1=await fetch(url1,{signal:wikiAbort.signal});
    const j1=await r1.json();
    const hits=(j1.query&&j1.query.search)||[];
    if(!hits.length){wikiCache[nq]={ts:now,data:[]};return[]}
    const ids=hits.slice(0,5).map(h=>h.pageid).join('|');
    const url2=`https://it.wikipedia.org/w/api.php?action=query&pageids=${ids}&prop=extracts|info&exintro=1&explaintext=1&inprop=url&format=json&origin=*`;
    const r2=await fetch(url2,{signal:wikiAbort.signal});
    const j2=await r2.json();
    const pages=j2.query&&j2.query.pages||{};
    const out=[];
    for(const h of hits.slice(0,5)){
      const p=pages[h.pageid];
      if(!p||!p.extract)continue;
      const extract=p.extract.slice(0,500);
      const title=p.title;
      if(/^(Giornale|Quotidiano|Newspaper|Rivista|Testata|Lista|Elenco)/i.test(title))continue;
      const naz=estraiNazione(extract);
      const cont=naz?NAZ_CONT[norm(naz)]||'':'';
      const dom=estraiDominio(extract,title);
      out.push({fonte:'wiki',titolo:title,nazione:naz||'',continente:cont,dominio:dom,descrizione:extract.split(/\.\s/)[0].slice(0,180)+'.'});
    }
    wikiCache[nq]={ts:now,data:out};
    return out;
  }catch(e){
    if(e.name==='AbortError')return[];
    wikiCache[nq]={ts:now,data:[]};
    return [];
  }
}

function risultatiCatalogo(q){
  const nq=norm(q);
  return CAT.filter(r=>{
    if(r.length!==5)return false;
    if(CF.cont!=='Tutti'&&r[0]!==CF.cont)return false;
    if(CF.naz!=='Tutti'&&r[1]!==CF.naz)return false;
    if(!nq)return CF.cont!=='Tutti'||CF.naz!=='Tutti';
    return norm(r[3]+' '+r[0]+' '+r[1]+' '+r[2]).includes(nq);
  });
}

/* ---------- RSS ---------- */
async function fetchRSS(rssUrl){
  const proxies=[
    'https://api.rss2json.com/v1/api.json?rss_url='+encodeURIComponent(rssUrl),
    'https://api.allorigins.win/raw?url='+encodeURIComponent(rssUrl)
  ];
  for(const p of proxies){
    try{
      const r=await fetch(p);if(!r.ok)continue;
      if(p.includes('allorigins')){
        const txt=await r.text();
        const xml=new DOMParser().parseFromString(txt,'text/xml');
        const items=[...xml.querySelectorAll('item,entry')].slice(0,3).map(i=>{
          const t=i.querySelector('title')?.textContent?.trim();
          const enc=i.querySelector('enclosure')?.getAttribute('url');
          const media=i.getElementsByTagName('media:content')[0]?.getAttribute('url');
          return {title:t,thumbnail:enc||media,content:i.querySelector('description,content')?.textContent||'',link:(i.querySelector('link')?.getAttribute('href'))||i.querySelector('link')?.textContent?.trim()||'',pubDate:i.querySelector('pubDate,published,updated')?.textContent||''};
        }).filter(x=>x.title);
        if(items.length)return {items};
      }else{
        const j=await r.json();
        if(j.items&&j.items.length)return j;
      }
    }catch(e){continue}
  }
  throw new Error('Nessun proxy');
}
async function caricaTitoli(){
  const TTL=10*60*1000;
  const coda=DATI.filter(d=>d.rss&&!(T[d.id]&&'img' in T[d.id]&&T[d.id].l&&Date.now()-T[d.id].ts<TTL));
  const lavora=async()=>{while(coda.length){const d=coda.shift();
    try{
      const j=await fetchRSS(d.rss);
      if(j.items&&j.items.length){
        const its=j.items.slice(0,3).filter(i=>(i.title||'').trim());
        const nuovi=its.map(i=>i.title.trim());
        const ls=its.map(i=>i.link||i.url||'');
        const ps=its.map(i=>pd(i.pubDate||i.published));
        const vecchio=T[d.id]&&T[d.id].t&&T[d.id].t[0];
        const it=j.items[0];let im=it.thumbnail||'';
        if(!im&&it.enclosure&&it.enclosure.link&&/image|\.(jpe?g|png|webp)/i.test((it.enclosure.type||'')+it.enclosure.link))im=it.enclosure.link;
        if(!im){const m=(it.content||it.description||'').match(/<img[^>]+src=["']([^"']+)/i);if(m)im=m[1]}
        if(im)im=im.replace(/^http:/i,'https:');
        T[d.id]={t:nuovi,l:ls,p:ps,ts:Date.now(),img:im};sv('tm_t',T);if(im)setImg(d.id,im);
        if(S.notif&&F.fav[d.id]!==undefined&&vecchio&&vecchio!==nuovi[0])notifica(d,nuovi[0]);
      }
    }catch(e){document.querySelectorAll(`[data-ti="${d.id}"]`).forEach(x=>x.textContent=navigator.onLine?'Titoli non disponibili ora':'Offline')}
  }};
  await Promise.all([lavora(),lavora(),lavora()]);
  try{localStorage.setItem('tm_u',Date.now())}catch(e){}
  const u=$('#up');if(u)u.textContent=updTxt();
  if(view==='ultime')renderUltime(true);
}

}

async function trad(txt,lang){
  const k=lang+'|'+txt;
  if(TR[k])return TR[k];
  let out='';
  try{
    if(self.Translator){
      TRN[lang]=TRN[lang]||await Translator.create({sourceLanguage:lang,targetLanguage:'it'});
      out=await TRN[lang].translate(txt);
    }
  }catch(e){out=''}
  if(!out){
    const r=await fetch('https://api.mymemory.translated.net/get?q='+encodeURIComponent(txt)+'&langpair='+lang+'|it&de=app@testatemondiali.it');
    const j=await r.json();
    out=(j&&j.responseData&&j.responseData.translatedText)||'';
    if(j&&j.quotaFinished||/MYMEMORY WARNING|INVALID|QUERY LENGTH/i.test(out))out='';
    out=dec(out);
  }
  if(out){if(Object.keys(TR).length>400)TR={};TR[k]=out;sv('tm_tr',TR)}
  return out;
}

function salvaModifica(id){
  const d=DATI.find(x=>x.id===id);
  if(!d){toast('Testata non trovata');return}
  const nuovo={
    nome:(document.getElementById('m-nome')?.value||'').trim(),
    link:(document.getElementById('m-link')?.value||'').trim(),
    continente:(document.getElementById('m-cont')?.value||'').trim(),
    nazione:(document.getElementById('m-naz')?.value||'').trim(),
    tipo:(document.getElementById('m-tipo')?.value||'Quotidiano'),
    descrizione:(document.getElementById('m-desc')?.value||'').trim(),
    rss:(document.getElementById('m-rss')?.value||'').trim()
  };
  if(!nuovo.nome||!nuovo.link||!nuovo.continente||!nuovo.nazione){toast('Nome, link, continente e nazione sono obbligatori');return}
  if(!/^https?:\/\//i.test(nuovo.link))nuovo.link='https://'+nuovo.link;
  try{new URL(nuovo.link)}catch(e){toast('Il link non è valido');return}
  X.edit[id]=Object.assign({},X.edit[id]||{},nuovo);
  const ok=sv('tm_x',X);
  if(!ok){toast('❌ Errore: memoria piena');return}
  rebuild();
  if(T[id]){delete T[id];sv('tm_t',T)}
  chiudi();
  refresh();
  toast('✅ Modifiche salvate');
  if(nuovo.rss)caricaTitoli();
}

/* ---------- ELIMINA ---------- */
function elimina(id){
  const d=DATI.find(x=>x.id===id);
  if(!d){toast('Testata non trovata');return}
  conferma('🗑️ Eliminare «'+esc(d.nome)+'»?<br><span class="ds" style="font-weight:400">La testata verrà rimossa. Potrai ripristinarla da Impostazioni → "Ripristina testate eliminate".</span>',()=>{
    if(X.add.some(a=>a.id===id))X.add=X.add.filter(a=>a.id!==id);
    else if(!X.del.includes(id))X.del.push(id);
    delete F.fav[id];
    S.ordine=S.ordine.filter(i=>i!==id);
    delete X.edit[id];
    sv('tm_x',X);sv('tm_f',F);sv('tm_s',S);
    rebuild();
    chiudi();
    refresh();
    toast('🗑️ '+d.nome+' eliminato');
  });
}

function catalogo(){
  const have=new Set(DATI.map(d=>host(d.link)));
  const l=CAT.filter(r=>r.length===5&&!have.has(r[4])).sort((a,b)=>(a[0]+'|'+a[1]).localeCompare(b[0]+'|'+b[1]));
  let h='<div class="vh"><h3 class="serif" style="margin:0;flex:1">Catalogo testate</h3>'+CLS+'</div>';
  if(!l.length)h+='<p class="ds">Hai già aggiunto tutte le testate del catalogo.</p>';
  let lastC='',lastN='';
  l.forEach(r=>{
    if(r[0]!==lastC){lastC=r[0];lastN='';h+=`<div class="dsep" style="border-radius:12px">${esc(r[0])}</div>`}
    if(r[1]!==lastN){lastN=r[1];h+=`<div class="fh" style="margin:.6rem 0 .3rem"><h3 class="serif" style="font-size:.95rem">📍 ${esc(r[1])}</h3></div>`}

}

function apriMenu(){
  const m=$('#m3'),b=$('#b3');
  if(m.classList.contains('on')){m.classList.remove('on');$('#ov').classList.remove('on');return}
  const r=b.getBoundingClientRect();
  m.style.top=(r.bottom+8)+'px';
  m.style.right=Math.max(8,window.innerWidth-r.right)+'px';
  m.classList.add('on');$('#ov').classList.add('on');
}
function muovi(id,m){
  const ids=ordinati().map(d=>d.id);
  if(m==='top'){ids.splice(ids.indexOf(id),1);ids.unshift(id)}
  else{
    const pool=ids.filter(i=>{
      const d=DATI.find(x=>x.id===i);
      if(orgMode)return true;
      return visibile(d)&&(!Q.trim()||norm(d.nome+' '+d.nazione+' '+d.continente+' '+d.tipo).includes(norm(Q.trim())));
    });
    const idx=pool.indexOf(id);if(idx<0)return;
    const n=pool[idx+m];if(!n)return toast(m<0?'È già in cima':'È già in fondo');
    const a=ids.indexOf(id),b=ids.indexOf(n);[ids[a],ids[b]]=[ids[b],ids[a]];
  }
  S.ordine=ids;sv('tm_s',S);
  if(view==='home')renderHome();
  requestAnimationFrame(()=>{const el=document.querySelector('[data-id="'+id+'"]');if(el)el.scrollIntoView({block:'center'})});
}
function ordinaAlfabetico(){
  const ids=[...ordinati()].sort((a,b)=>a.nome.localeCompare(b.nome,'it')).map(d=>d.id);
  S.ordine=ids;sv('tm_s',S);renderHome();toast('Ordinamento alfabetico applicato');
}
let debTimer=null;
function debounceRicerca(){if(debTimer)clearTimeout(debTimer);debTimer=setTimeout(()=>renderRicercaCatalogo(),500)}

/* ============================================================
   CLICK HANDLER GLOBALE
   ============================================================ */
document.addEventListener('click',e=>{
  // Bottoni No/Sì del dialog di conferma
  if(e.target.id==='btn-no'){chiudi();azioneConferma=null;return}
  if(e.target.id==='btn-si'){
    const az=azioneConferma;
    azioneConferma=null;
    if(az)az();
    return;
  }

  const t=e.target.closest('button,a,[data-o]');
  if(!t)return;
  const D=t.dataset;
  if(t.tagName==='A')e.preventDefault();
  if(t.id==='bm'){$('#dr').classList.add('on');$('#ov').classList.add('on');return}
  if(t.id==='b3'){apriMenu();return}
  if(t.id==='ov')return;

  // CHIUDI / TORNA ALLA HOME (priorità alta, prima di tutto il resto)
  if('home' in D){e.stopPropagation();return show('home')}
  if('x' in D){e.stopPropagation();return chiudi()}

  // MODIFICA
  if(D.edit!==undefined){e.stopPropagation();return modifica(D.edit)}
  if(D.saveEdit!==undefined){e.stopPropagation();return salvaModifica(D.saveEdit)}
  if(D.delInDialog!==undefined){e.stopPropagation();const id=D.delInDialog;chiudi();setTimeout(()=>elimina(id),150);return}

  // AZIONI
  if(D.pin)return muovi(D.pin,-1);
  if(D.pdn)return muovi(D.pdn,1);
  if(D.up)return muovi(D.up,-1);
  if(D.dn)return muovi(D.dn,1);
  if(D.top)return muovi(D.top,'top');
  if(D.rm){e.stopPropagation();return elimina(D.rm)}
  if(D.rem!==undefined){e.stopPropagation();return elimina(D.rem)}
  if(D.s)return scegliCartella(D.s);
  if(D.ed)return scegliCartella(D.ed);

  // NAVIGAZIONE
  if(D.v==='org'){view='home';orgMode=true;chiudi();
    $$('.view').forEach(el=>el.classList.toggle('on',el.id==='v-home'));
    $('#tt').textContent='Organizza';renderHome();scrollTo(0,0);return}
  if(D.v)return show(D.v);
  if('om' in D){orgMode=false;return renderHome()}

  // FILTRI CATALOGO
  if(D.cc!==undefined){CF.cont=D.cc;CF.naz='Tutti';sv('tm_cf',CF);renderRicercaCatalogo();return}
  if(D.cn!==undefined){CF.naz=D.cn;sv('tm_cf',CF);renderRicercaCatalogo();return}
  if('creset' in D){CF={cont:'Tutti',naz:'Tutti'};sv('tm_cf',CF);renderRicercaCatalogo();return}

  // AGGIUNTA DAL CATALOGO
  if(D.ct!==undefined){
    const r=CAT[+D.ct];
    if(!r||r.length!==5)return;
    salva({...N('k_'+r[4],r[3],r[4],r[0],r[1],'Testata aggiunta dal catalogo.',''),tipo:r[2]});
    return;
  }
  if(D.wk!==undefined){
    const w=window.__wikiStore&&window.__wikiStore[D.wk];
    if(!w)return;
    const slug=w.dominio||'';
    aggiungi({nome:w.titolo,link:slug?'https://'+slug:'',continente:w.continente||'',nazione:w.nazione||'',descrizione:w.descrizione||''});
    return;
  }
  if(D.manual!==undefined){
    const testo=D.manual;
    const slug=norm(testo).replace(/[^a-z0-9]/g,'').slice(0,30);
    aggiungi({nome:testo,link:slug.length>=3?'https://'+slug+'.com':''});
    return;
  }

  // ALTRE AZIONI
  // Il link del menu usa data-ad, quindi dataset.ad (non dataset.add).
  // Manteniamo anche il vecchio alias data-add per compatibilità.
  if('ad' in D || 'add' in D){e.stopPropagation();chiudi();return aggiungi()}
  if('rs' in D)return conferma('Ripristinare le testate eliminate?',()=>{X.del=[];sv('tm_x',X);rebuild();refresh();toast('Testate ripristinate')});
  if(D.a){chiudi();
    if(D.a==='inst'){if(deferred){deferred.prompt();deferred=null}else toast('Dal menu del browser scegli "Aggiungi a schermata Home"')}
    else if(D.a==='tema'){S.tema=eff()==='chiaro'?'scuro':'chiaro';sv('tm_s',S);applica();if(view==='imp')renderImp()}
    else show(D.a);return}
  if(D.vi){S.vista=D.vi;sv('tm_s',S);return renderHome()}
  if(D.f){S.filtro=D.f;S.naz='Tutti';sv('tm_s',S);return rh()}
  if(D.z){S.naz=D.z;sv('tm_s',S);return rh()}
  if(D.ty){S.tipo=D.ty;sv('tm_s',S);return rh()}
  if('cg' in D){chiudi();return catalogo()}
  if('ag' in D){toast('Aggiornamento in corso…');Object.values(T).forEach(x=>x.ts=0);return caricaTitoli().then(()=>toast('Titoli aggiornati'))}
  if(D.uf){S.uf=D.uf;sv('tm_s',S);return renderUltime(true)}
  if('ultr' in D){S.utr=!S.utr;sv('tm_s',S);return renderUltime(true)}
  if('upref' in D){S.upref=!S.upref;sv('tm_s',S);return renderUltime(true)}
  if(D.ol)return apri(D.ol);
  if(D.o)return apri(DATI.find(d=>d.id===D.o).link);
  if(D.del)return conferma('Rimuovere dai preferiti?',()=>{delete F.fav[D.del];sv('tm_f',F);refresh()});
  if('nc' in D)return nuovaCartella();
  if(D.rc)return rinomina(D.rc);
  if(D.dc)return conferma('Eliminare la cartella? Le testate resteranno nei preferiti, senza cartella.',()=>{
    F.cartelle=F.cartelle.filter(x=>x!==D.dc);
    Object.keys(F.fav).forEach(k=>{if(F.fav[k]===D.dc)F.fav[k]=''});
    sv('tm_f',F);refresh();
  });
  if('alf' in D)return ordinaAlfabetico();
  if('ro' in D)return conferma('Ripristinare l\'ordine originale?',()=>{S.ordine=[];sv('tm_s',S);renderHome()});
  if(D.g){S.grad=D.g;sv('tm_s',S);applica();return renderImp()}
  if(D.t){S.tema=D.t;sv('tm_s',S);applica();return renderImp()}
  if(D.fs){S.font=+D.fs;sv('tm_s',S);applica();return renderImp()}
  if('an' in D){S.anim=!S.anim;sv('tm_s',S);applica();return renderImp()}
  if(D.b){S.browser=D.b;sv('tm_s',S);return renderImp()}
  if(D.n!==undefined){
    if(D.n==='1'){
      if(!('Notification' in window))return toast('Notifiche non supportate');
      Notification.requestPermission().then(p=>{S.notif=p==='granted';sv('tm_s',S);renderImp();toast(p==='granted'?'Notifiche attivate':'Permesso non concesso')});
      return;
    }else{S.notif=false;sv('tm_s',S);renderImp();return}
  }
  if('clearCache' in D)return conferma('Svuotare i titoli salvati?',()=>{T={};sv('tm_t',T);toast('Archivio svuotato')});
  if(t.id==='ex'){const b=new Blob([JSON.stringify({app:'TestateMondiali',v:VER,S,F,X},null,1)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='TestateMondiali-dati.json';a.click();return toast('Dati esportati')}
  if(t.id==='im')return $('#fi').click();
});
$('#ov').onclick=chiudi;
document.addEventListener('change',e=>{if(e.target.id==='ty'){S.tipo=e.target.value;sv('tm_s',S);renderHome()}});
document.addEventListener('input',e=>{
  if(e.target.id==='q'){Q=e.target.value;applicaQ();debounceRicerca()}
});

/* ---------- IMPORT ---------- */
$('#fi').onchange=e=>{
  const f=e.target.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=()=>{
    try{
      const j=JSON.parse(r.result);
      if(j.app!=='TestateMondiali')throw new Error('app-mismatch');
      const Sdef={vista:'anteprime',tema:'chiaro',grad:'tramonto',font:100,anim:false,browser:'default',notif:false,ordine:[],filtro:'Tutti',naz:'Tutti',tipo:'Tutti',col:1};
      const Snew=Object.assign({},Sdef);
      Object.keys(Sdef).forEach(k=>{if(j.S&&k in j.S){const v=j.S[k];if(k==='font'&&typeof v==='number'&&v>=80&&v<=150)Snew[k]=v;else if(k==='ordine'&&Array.isArray(v))Snew[k]=v.filter(x=>typeof x==='string');else if(k==='tema'&&['auto','chiaro','scuro'].includes(v))Snew[k]=v;else if(k==='grad'&&GRAD[v])Snew[k]=v;else if(typeof Sdef[k]===typeof v)Snew[k]=v}});
      const Fnew={cartelle:Array.isArray(j.F?.cartelle)?j.F.cartelle.filter(x=>typeof x==='string'):[],fav:(j.F&&typeof j.F.fav==='object'&&j.F.fav)?j.F.fav:{}};
      const Xnew={add:Array.isArray(j.X?.add)?j.X.add.filter(d=>d&&d.id&&d.nome):[],del:Array.isArray(j.X?.del)?j.X.del.filter(x=>typeof x==='string'):[],edit:(j.X&&typeof j.X.edit==='object'&&j.X.edit)?j.X.edit:{}};
      conferma('Importare i dati? Quelli attuali verranno sostituiti.',()=>{
        S=Snew;F=Fnew;X=Xnew;sv('tm_s',S);sv('tm_f',F);sv('tm_x',X);rebuild();applica();show('imp');toast('Dati importati');
      });
    }catch(x){toast('File non valido o corrotto')}
  };
  r.readAsText(f);e.target.value='';
};

/* ---------- PWA / SW ---------- */
addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferred=e});
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));

/* ---------- PULL TO REFRESH ---------- */
(function(){
  let sy=0,pulling=false;
  addEventListener('touchstart',e=>{if(scrollY===0&&e.touches.length===1){sy=e.touches[0].clientY;pulling=true}},{passive:true});
  addEventListener('touchend',e=>{
    if(!pulling)return;pulling=false;
    const dy=(e.changedTouches[0]?.clientY||0)-sy;
    if(dy>80&&scrollY===0&&view==='home'){toast('Aggiornamento…');Object.values(T).forEach(x=>x.ts=0);caricaTitoli().then(()=>toast('Titoli aggiornati'))}
  });
})();

/* ---------- ONLINE/OFFLINE ---------- */
addEventListener('online',()=>{toast('Connessione ripristinata');caricaTitoli()});
addEventListener('offline',()=>{toast('Sei offline');if(view==='home')renderHome()});

function vaiHome(){
  chiudi();azioneConferma=null;
  if(debTimer){clearTimeout(debTimer);debTimer=null}
  Q='';CF={cont:'Tutti',naz:'Tutti'};sv('tm_cf',CF);
  if(document.activeElement&&document.activeElement.blur)document.activeElement.blur();
  show('home');
}
$('#tt').onclick=vaiHome;
$('#tt').onkeydown=e=>{if(e.key==='Enter')vaiHome()};
addEventListener('resize',()=>{if($('#m3').classList.contains('on'))apriMenu()});

function apriDaHash(){
  const h=(location.hash||'').replace('#','');
  if(!h)return;
  history.replaceState(history.state,'',location.pathname+location.search);
  if(h==='pref')show('pref');
  else if(h==='org'){show('home');orgMode=true;$('#tt').textContent='Organizza';renderHome()}
  else if(h==='cat'){show('home');catalogo()}
}
addEventListener('hashchange',apriDaHash);

applica();show('home');caricaTitoli();apriDaHash();
</script>
